[project]
name = "gameagent"
version = "0.12.0"
requires-python = ">=3.12"
dependencies = ["pillow>=10,<13"]

[project.optional-dependencies]
vision = ["opencv-python>=4.10,<5", "numpy>=1.26,<3"]
ocr = ["rapidocr>=3,<4", "onnxruntime>=1.20,<2"]
learning = ["gymnasium>=1.0,<2", "stable-baselines3>=2.5,<3"]
navigation = ["pathfinding>=1.0,<2", "minigrid>=3,<4"]
video = ["faster-whisper>=1.1,<2", "opencv-python>=4.10,<5"]

native-ui = ["pywebview>=5,<7", "pywin32>=306; sys_platform == 'win32'"]
