name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  base:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pathfinding pillow PySide6
      - run: python -m unittest discover -s tests -v
      - run: python -m gameagent.benchmark
      - run: python -m unittest tests.test_obsidian_ui -v
        env:
          QT_QPA_PLATFORM: offscreen
